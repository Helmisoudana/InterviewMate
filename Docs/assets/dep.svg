<svg width="100%" viewBox="0 0 850 320" role="img" xmlns="http://www.w3.org/2000/svg">
<title style="font-family:'Segoe UI', sans-serif;font-size:16px;">Architecture Hexagonale - Inversion de Dépendance</title>
<desc style="font-family:'Segoe UI', sans-serif;font-size:14px;">Schéma montrant que les Adapters et le Domaine dépendent des Ports, sans dépendance directe de l'Adapter vers le Domaine.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .label-title { font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
  .label-sub { font-size: 12px; font-weight: 400; text-anchor: middle; dominant-baseline: central; }
  .edge-label { font-size: 11px; font-weight: 500; fill: #4A5568; text-anchor: middle; }
  .dashed-line { stroke-dasharray: 5 4; }
</style>

<!-- 1. BLOC ADAPTERS (A) -->
<g>
  <rect x="40" y="80" width="230" height="90" rx="8" fill="#EDF2F7" stroke="#CBD5E0" stroke-width="1.5"/>
  <text x="155" y="108" class="label-title" fill="#2D3748">Adapters</text>
  <text x="155" y="132" class="label-sub" fill="#4A5568">(WebSocket, faster-whisper,</text>
  <text x="155" y="148" class="label-sub" fill="#4A5568">Ollama, Piper)</text>
</g>

<!-- 2. BLOC PORTS (B) -->
<g>
  <rect x="360" y="85" width="160" height="80" rx="8" fill="#4A5568" stroke="#2D3748" stroke-width="1.5"/>
  <text x="440" y="115" class="label-title" fill="#FFFFFF">Ports</text>
  <text x="440" y="137" class="label-sub" fill="#E2E8F0">(interfaces)</text>
</g>

<!-- 3. BLOC DOMAINE (C) -->
<g>
  <rect x="620" y="85" width="180" height="80" rx="8" fill="#2B6CB0" stroke="#1A365D" stroke-width="1.5"/>
  <text x="710" y="115" class="label-title" fill="#FFFFFF">Domaine</text>
  <text x="710" y="137" class="label-sub" fill="#E2E8F0">(use cases, entités)</text>
</g>

<!-- FLÈCHE 1: A -> B (dépend de) -->
<path d="M 270 110 C 300 110, 310 110, 360 110" fill="none" stroke="#718096" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="315" y="100" class="edge-label">dépend de</text>

<!-- FLÈCHE 2: B -> A (implémentés par) -->
<path d="M 360 140 C 310 140, 300 140, 270 140" fill="none" stroke="#718096" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="315" y="152" class="edge-label">implémentés par</text>

<!-- FLÈCHE 3: C -> B (définit) -->
<line x1="620" y1="125" x2="520" y2="125" stroke="#718096" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="570" y="115" class="edge-label">définit</text>

<!-- FLÈCHE 4: A -.- C (ne dépend jamais directement) -->
<path d="M 155 170 C 155 250, 710 250, 710 165" fill="none" stroke="#E53E3E" stroke-width="1.5" class="dashed-line" marker-end="url(#arrow)"/>
<rect x="330" y="238" width="220" height="22" rx="4" fill="#FFF5F5" stroke="#FED7D7" stroke-width="1"/>
<text x="440" y="249" class="edge-label" fill="#C53030">ne dépend jamais directement</text>

</svg>
