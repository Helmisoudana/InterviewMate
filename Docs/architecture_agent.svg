<svg width="680" height="464" viewBox="0 0 680 464" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Architecture du module agent</title>
<desc>Le gateway appelle les use cases du module agent, qui s'appuient sur les services de domaine et le registre de session, puis passent par les adapters vers Ollama et le module storage.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<line x1="340" y1="84" x2="340" y2="128" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<rect x="240" y="40" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="55" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">gateway</text>
<text x="340" y="71" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">appelant externe</text>
<path d="M340 184L340 206L205 206L205 228" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M340 184L340 206L475 206L475 228" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<rect x="210" y="128" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="148" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Use cases agent</text>
<text x="340" y="166" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">Start . Conduire . End session</text>
<line x1="205" y1="284" x2="205" y2="312" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="475" y1="284" x2="475" y2="312" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<rect x="90" y="228" width="230" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="205" y="248" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Prompt systeme + JSON</text>
<text x="205" y="266" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">construction + validation</text>
<rect x="360" y="228" width="230" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="475" y="248" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">AgentSessionRegistry</text>
<text x="475" y="266" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">sessions en memoire</text>
<line x1="205" y1="356" x2="205" y2="380" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="475" y1="356" x2="475" y2="380" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<rect x="90" y="312" width="230" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="205" y="327" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">OllamaAdapter</text>
<text x="205" y="343" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">implemente LLMPort</text>
<rect x="360" y="312" width="230" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="475" y="327" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">StorageNotifierAdapter</text>
<text x="475" y="343" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">notifie le module storage</text>
<rect x="90" y="380" width="230" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="205" y="395" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Ollama (LLM local)</text>
<text x="205" y="411" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">serveur externe</text>
<rect x="360" y="380" width="230" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="475" y="395" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Module storage</text>
<text x="475" y="411" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">persistance externe</text>
</svg>
