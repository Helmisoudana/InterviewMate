<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>InterviewMate — Client de test</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
  button { padding: 10px 20px; font-size: 16px; margin-right: 10px; }
  #log { background: #111; color: #0f0; padding: 10px; height: 300px;
         overflow-y: auto; font-family: monospace; font-size: 13px; white-space: pre-wrap; }
  #status { font-weight: bold; margin: 10px 0; }
</style>
</head>
<body>
  <h2>InterviewMate — Client de test WebSocket</h2>
  <div id="status">Déconnecté</div>
  <button id="btnConnect">Se connecter + parler</button>
  <button id="btnStop" disabled>Arrêter</button>
  <div id="log"></div>

<script>
const WS_URL = "ws://localhost:8765";
const SAMPLE_RATE = 16000; // doit matcher SAMPLE_RATE côté asr/tts

let ws = null;
let audioCtx = null;
let micStream = null;
let processorNode = null;
let sourceNode = null;
let gainNode = null;
let playbackTime = 0; // pour enchaîner la lecture des chunks TTS reçus

const logEl = document.getElementById("log");
const statusEl = document.getElementById("status");
const btnConnect = document.getElementById("btnConnect");
const btnStop = document.getElementById("btnStop");

function log(msg) {
  logEl.textContent += msg + "\n";
  logEl.scrollTop = logEl.scrollHeight;
}

function setStatus(txt) { statusEl.textContent = txt; }

function float32ToPCM16(float32Array) {
  const buf = new ArrayBuffer(float32Array.length * 2);
  const view = new DataView(buf);
  for (let i = 0; i < float32Array.length; i++) {
    let s = Math.max(-1, Math.min(1, float32Array[i]));
    view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  return buf;
}

// --- Downsample vers 16kHz si le micro capture à un autre taux ---
function downsampleBuffer(buffer, inputRate, outputRate) {
  if (outputRate === inputRate) return buffer;
  const ratio = inputRate / outputRate;
  const newLength = Math.round(buffer.length / ratio);
  const result = new Float32Array(newLength);
  let offsetResult = 0, offsetBuffer = 0;
  while (offsetResult < result.length) {
    const nextOffsetBuffer = Math.round((offsetResult + 1) * ratio);
    let accum = 0, count = 0;
    for (let i = offsetBuffer; i < nextOffsetBuffer && i < buffer.length; i++) {
      accum += buffer[i]; count++;
    }
    result[offsetResult] = accum / (count || 1);
    offsetResult++;
    offsetBuffer = nextOffsetBuffer;
  }
  return result;
}

function playPCM16Chunk(arrayBuffer) {
  if (!audioCtx) return;
  const int16 = new Int16Array(arrayBuffer);
  const float32 = new Float32Array(int16.length);
  for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768;

  const audioBuffer = audioCtx.createBuffer(1, float32.length, SAMPLE_RATE);
  audioBuffer.copyToChannel(float32, 0);

  const src = audioCtx.createBufferSource();
  src.buffer = audioBuffer;
  src.connect(audioCtx.destination);

  const now = audioCtx.currentTime;
  const startAt = Math.max(now, playbackTime);
  src.start(startAt);
  playbackTime = startAt + audioBuffer.duration;
}

async function connecterEtParler() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  
  if (audioCtx.state === "suspended") {
    await audioCtx.resume();
  }
  
  playbackTime = 0;

  ws = new WebSocket(WS_URL);
  ws.binaryType = "arraybuffer";

  ws.onopen = () => {
    setStatus("Connecté — envoi de l'init...");
    const sessionId = "test-" + Math.random().toString(36).slice(2, 10);
    ws.send(JSON.stringify({ session_id: sessionId }));
    log("[WS] init envoyé, session_id=" + sessionId);
  };

  ws.onmessage = async (event) => {
    if (typeof event.data === "string") {
      log("[WS TEXTE] " + event.data);
      const payload = JSON.parse(event.data);
      
      if (payload.type === "session_ready") {
        setStatus("Session prête — parlez !");
        await demarrerMicro();
      } else if (payload.type === "transcription") {
        log("🎤 Candidat : " + payload.text);
      } else if (payload.type === "agent_question") {
        log("🤖 Agent : " + payload.text);
      }
    } else {
      playPCM16Chunk(event.data);
    }
  };

  ws.onerror = (e) => log("[WS ERREUR] Erreur de connexion WebSocket");
  ws.onclose = (e) => {
    setStatus("Déconnecté (" + e.code + " " + e.reason + ")");
    log("[WS] fermé : code=" + e.code + " raison=" + e.reason);
    arreterMicro();
  };

  btnConnect.disabled = true;
  btnStop.disabled = false;
}

async function demarrerMicro() {
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    sourceNode = audioCtx.createMediaStreamSource(micStream);

    // ScriptProcessorNode
    processorNode = audioCtx.createScriptProcessor(4096, 1, 1);
    processorNode.onaudioprocess = (e) => {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const input = e.inputBuffer.getChannelData(0);
      const downsampled = downsampleBuffer(input, audioCtx.sampleRate, SAMPLE_RATE);
      const pcm16 = float32ToPCM16(downsampled);
      ws.send(pcm16);
    };

    gainNode = audioCtx.createGain();
    gainNode.gain.value = 0; 

    sourceNode.connect(processorNode);
    processorNode.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    
    log("[MICRO] Capture audio démarrée à " + SAMPLE_RATE + "Hz");
  } catch (err) {
    log("[ERREUR MICRO] " + err.message);
  }
}

function arreterMicro() {
  if (processorNode) { processorNode.disconnect(); processorNode = null; }
  if (sourceNode) { sourceNode.disconnect(); sourceNode = null; }
  if (gainNode) { gainNode.disconnect(); gainNode = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
}

function arreterTout() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: "close" }));
  }
  arreterMicro();
  btnConnect.disabled = false;
  btnStop.disabled = true;
  setStatus("Déconnecté");
}

btnConnect.onclick = connecterEtParler;
btnStop.onclick = arreterTout;
</script>
</body>
</html>
