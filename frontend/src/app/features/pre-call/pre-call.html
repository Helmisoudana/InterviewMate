<div class="precall-container">
  <div class="precall-card">
    <h2>Vérification du matériel</h2>
    <p>Testez votre caméra et votre microphone avant d'entrer.</p>

    <div class="video-preview-box">
      <video #videoPreview autoplay playsinline [class.hidden]="!isVideoOn()"></video>
      @if (!isVideoOn()) {
        <div class="camera-off">
          <!-- Icône Caméra coupée grands formats -->
          <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="2" y1="2" x2="22" y2="22"></line>
            <path d="M10.66 6H14a2 2 0 0 1 2 2v2.34l1 1L22 8v8"></path>
            <path d="M16 16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h2.34"></path>
          </svg>
          <span>Caméra coupée</span>
        </div>
      }

      <!-- Vumètre du micro en bas -->
      <div class="mic-meter">
        <div class="mic-level" [style.width.%]="audioLevel()"></div>
      </div>
    </div>

    <!-- Boutons de contrôle style Interview Room -->
    <div class="controls">
      <!-- Bouton Micro -->
      <button class="ctrl-btn" [class.off]="isMuted()" (click)="toggleMute()">
        @if (!isMuted()) {
          <!-- Micro Actif -->
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="22"></line>
          </svg>
          <span>Micro actif</span>
        } @else {
          <!-- Micro Désactivé -->
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="1" y1="1" x2="23" y2="23"></line>
            <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V5a3 3 0 0 0-5.94-.6"></path>
            <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path>
            <line x1="12" y1="19" x2="12" y2="22"></line>
          </svg>
          <span>Micro désactivé</span>
        }
      </button>

      <!-- Bouton Caméra -->
      <button class="ctrl-btn" [class.off]="!isVideoOn()" (click)="toggleVideo()">
        @if (isVideoOn()) {
          <!-- Caméra Active -->
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="23 7 16 12 23 17 23 7"></polygon>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
          </svg>
          <span>Caméra active</span>
        } @else {
          <!-- Caméra Coupée -->
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="2" y1="2" x2="22" y2="22"></line>
            <path d="M10.66 6H14a2 2 0 0 1 2 2v2.34l1 1L22 8v8"></path>
            <path d="M16 16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h2.34"></path>
          </svg>
          <span>Caméra coupée</span>
        }
      </button>
    </div>

    <button class="btn-join" (click)="joinInterview()">Rejoindre l'entretien</button>
  </div>
</div>
