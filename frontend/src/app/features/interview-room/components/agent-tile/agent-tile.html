<div class="agent-card" [class.speaking]="isSpeaking()">
  
  <!-- Conteneur Image WebP -->
  <div class="avatar-container" [class.hidden]="!imageLoaded()">
    <img
      [src]="avatarSource"
      alt="Interviewer IA"
      class="avatar-image"
      (load)="onImageLoad()"
      (error)="onImageError($event)"
    />
  </div>

  <!-- Placeholder tant que l'image n'est pas chargée -->
  @if (!imageLoaded()) {
    <div class="avatar-placeholder">
      <div class="loading-spinner"></div>
      <p>Chargement de l'interviewer...</p>
    </div>
  }

  <!-- Informations superposées en bas -->
  <div class="agent-overlay">
    <span class="agent-name">Sarah — Recruteuse IA</span>
    @if (isSpeaking()) {
      <span class="speaking-badge">En train de parler...</span>
    }
  </div>
</div>
