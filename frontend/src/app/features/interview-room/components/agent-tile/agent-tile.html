<div class="agent-card" [class.speaking]="isSpeaking()">
  <div class="video-wrapper">
    <video
      #idleVideo
      [src]="idleSource"
      autoplay
      loop
      [muted]="true"
      playsinline
      class="avatar-video"
      [class.visible]="!isSpeaking()"
      (canplay)="onVideoLoaded()"
    ></video>

    <video
      #talkingVideo
      [src]="talkingSource"
      autoplay
      loop
      [muted]="true"
      playsinline
      class="avatar-video"
      [class.visible]="isSpeaking()"
    ></video>
  </div>

  <div class="agent-overlay">
    <span class="status-dot" [class.active]="isSpeaking()"></span>
    <span class="agent-name">Sarah — Recruteuse IA</span>
  </div>
</div>
